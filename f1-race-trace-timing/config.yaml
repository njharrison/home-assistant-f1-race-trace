name: F1 Race Trace Timing
version: "0.3.16"
slug: f1_race_trace_timing
description: Historical lap timing export and persistent live gap recorder for F1 Race Trace
url: https://github.com/njharrison/home-assistant-f1-race-trace
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
homeassistant_api: true
supervisor_api: true
hassio_api: true
map:
  - share:rw
  - config:rw
options:
  year: 2026
  event: Japanese Grand Prix
  session: R
  record_live: true
  record_gps: false
  track_map_entry_id: ""
  driver_entity: sensor.f1_drivers_driver_positions
  lap_entity: sensor.f1_race_lap_count
  tyre_entity: sensor.f1_drivers_current_tyres
  race_control_entity: sensor.f1_officials_race_control
  track_status_entity: sensor.f1_track_status
schema:
  year: int(1950,2100)
  event: str
  session: str
  record_live: bool
  record_gps: bool
  track_map_entry_id: str
  driver_entity: str
  lap_entity: str
  tyre_entity: str
  race_control_entity: str
  track_status_entity: str
